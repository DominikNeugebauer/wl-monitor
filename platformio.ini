; PlatformIO config for ESP32-S3 (N16R8)
[env:esp32s3camlcd]
platform = espressif32
board = esp32s3camlcd
framework = arduino
monitor_speed = 115200

; Use quad SPI flash mode instead of octal
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio

; USB serial (CDC)
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Flash size (N16R8)
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; Large app partition, the firmware needs more than 1.3 MB
board_build.partitions = default_16MB.csv

; Serial port. Check the name with `ls /dev/cu.*` or `pio device list`.
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101

; After changing web/index.html run: python3 tools/embed_web.py
; This generates src/generated/web_assets.h.

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BusIO
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.4.1
